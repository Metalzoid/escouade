name: Stats

# Every day: the downloads of the releases, as GitHub counts them, kept in stats/downloads.csv and
# summed up in the README (scripts/download-stats.mjs). GitHub keeps only a counter per file, with no
# history: this is the history.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    name: Downloads of the releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Read the counters
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/download-stats.mjs

      # [skip ci]: a commit of figures needs no build.
      - name: Commit the figures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stats/downloads.csv README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(stats): téléchargements du $(date -u +%F) [skip ci]"
          git push
